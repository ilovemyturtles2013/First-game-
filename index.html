<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Juego en GitHub</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #1a1a1a; color: white; margin-top: 50px; }
        #boton { padding: 15px 30px; font-size: 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #boton:hover { background: #218838; }
    </style>
</head>
<body>
    <h1>¡El Juego del Clic Rápido!</h1>
    <p>Haz todos los clics que puedas antes de que termine el tiempo.</p>
    <button id="boton" onclick="contar()">¡Haz clic aquí!</button>
    <h2>Clics: <span id="contador">0</span></h2>
    <h3>Tiempo restante: <span id="tiempo">10</span> segundos</h3>

    <script>
        let clics = 0;
        let tiempo = 10;
        let jugando = false;
        let intervalo;

        function contar() {
            if (!jugando) {
                jugando = true;
                intervalo = setInterval(() => {
                    tiempo--;
                    document.getElementById('tiempo').innerText = tiempo;
                    if (tiempo <= 0) {
                        clearInterval(intervalo);
                        document.getElementById('boton').disabled = true;
                        alert("¡Tiempo fuera! Tu puntuación final es: " + clics);
                    }
                }, 1000);
            }
            clics++;
            document.getElementById('contador').innerText = clics;
        }
    </script>
</body>
</html>
